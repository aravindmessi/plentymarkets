  /* body {font-family: Arial;} */

/* Center the loader */
#loader {
  position: absolute;
  left: 60%;
  top: 50%;
  z-index: 1;
  width: 30px;
  height: 30px;
  margin: -30px 0 0 -56px;
  border: 5px solid #f3f3f3;
  border-radius: 50%;
  border-top: 5px solid #3498db;
  -webkit-animation: spin 2s linear infinite;
  animation: spin 2s linear infinite;
}

@-webkit-keyframes spin {
  0% { -webkit-transform: rotate(0deg); }
  100% { -webkit-transform: rotate(360deg); }
}

@keyframes spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

/* Add animation to "page content" */
.animate-bottom {
  position: relative;
  -webkit-animation-name: animatebottom;
  -webkit-animation-duration: 1s;
  animation-name: animatebottom;
  animation-duration: 1s
}

@-webkit-keyframes animatebottom {
  from { bottom:-100px; opacity:0 } 
  to { bottom:0px; opacity:1 }
}

@keyframes animatebottom { 
  from{ bottom:-100px; opacity:0 } 
  to{ bottom:0; opacity:1 }
}
#myDiv {
  display: none;
  
}
b.b {
  position: absolute;
  margin-left:4px;
}  
.cut-text1 { 
   white-space: nowrap; 
  width: 100px; 
  height: 25px;
  overflow: hidden;
  text-overflow: ellipsis; 
  border: 1px solid #978585;
}
.cut-text { 
  white-space: nowrap; 
  width: 80px; 
  height: 20px;
  overflow: hidden;
  text-overflow: ellipsis;
  border: 1px solid #000000;
}
.cut-text .tooltiptext {
  visibility: hidden;
  /* width: 220px; */
  background-color: black;
  color: #fff;
  text-align: center;
  border-radius: 6px;
  padding: 3px 1px;
  
  /* Position the tooltip */
  position: absolute;
  z-index: 1;
  top: 90%;
  font-size: 10px;
  margin-left: -60px;
}

.cut-text:hover .tooltiptext {
  visibility: visible;
}
</style>

<script>

  function recent() {
    //console.log("HAI",tab_bool);
    mode = "recent";
    //console.log(tab_bool);
    console.log(window.tab_bool);
    
    if (window.tab_bool) {
      document.getElementById('user-no').style.display = 'block';
      document.getElementById('user-yes').style.display = 'none';
      document.getElementById('show-spin').style.display = 'none';
      document.getElementById('stock-yes').style.display = 'none';
      document.getElementById('rma-yes').style.display = 'none';
      document.getElementById('show-ship-spin').style.display = 'none';
    }
    else {
      document.getElementById('user-yes').style.display = 'block';
      document.getElementById('user-yes-tab').style.display = 'block';
      //document.getElementById('past_orders').style.display = 'none';
      document.getElementById('user-no').style.display = window.customExists ? "none" : 'block';
      document.getElementById('show-spin').style.display = 'none';
      document.getElementById('stock-yes').style.display = 'none';
      document.getElementById('rma-yes').style.display = 'none';
      document.getElementById('show-ship-spin').style.display = 'none';
    }
  }
  
  function stockDetails() {
    mode = "stock";
    //console.log(tab_bool);
    if (window.tab_bool) {
      document.getElementById('user-no').style.display = 'none';
      document.getElementById('user-yes').style.display = 'none';
      document.getElementById('show-spin').style.display = 'none';
      document.getElementById('stock-yes').style.display = 'none';
      document.getElementById('rma-yes').style.display = 'none';
      document.getElementById('show-ship-spin').style.display = 'none';
    }
    else {
      document.getElementById('user-yes-tab').style.display = 'none';
      document.getElementById('user-no').style.display = 'none';
      document.getElementById('show-spin').style.display = 'none';
      document.getElementById('rma-yes').style.display = 'none';
      
     if(!orderNumber){
          document.getElementById('stock-yes').style.display = 'none';
          
       }else{
        document.getElementById('stock-yes').style.display = 'block';
        
       }
    }
  }
</script>
